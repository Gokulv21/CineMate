<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04100c"/>
      <stop offset="100%" stop-color="#09241b"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="472" height="472" x="20" y="20" rx="96" fill="none" stroke="#10b981" stroke-opacity="0.35" stroke-width="4"/>

  <!-- Cinema Card -->
  <rect width="360" height="360" x="76" y="76" rx="72" fill="#061912" stroke="#10b981" stroke-opacity="0.6" stroke-width="6" filter="url(#glow)"/>

  <!-- Play Symbol / Heart -->
  <path d="M210 160 L360 256 L210 352 Z" fill="url(#emeraldGrad)"/>
  
  <!-- CineMate Heart Emblem -->
  <circle cx="360" cy="140" r="28" fill="#047857" stroke="#34d399" stroke-width="4"/>
  <path d="M352 138 C352 132 357 128 361 133 C365 128 370 132 370 138 C370 145 361 150 361 150 C361 150 352 145 352 138 Z" fill="#ecfdf5"/>
</svg>
